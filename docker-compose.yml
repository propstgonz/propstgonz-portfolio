services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: propstgonz-web
    restart: unless-stopped
    env_file: .env
    volumes:
      # Persists the click counter on the host's RAID array instead of
      # inside the container, so it survives rebuilds/redeploys.
      - /media/raid/database/portfolio-counter:/data
    environment:
      COUNTER_FILE: /data/counter.json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`propstgonz.baronette.es`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=4321"
    networks:
      - proxy

networks:
  proxy:
    external: true # shared Traefik network — must exist on the host
